<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Balap Karung Kuis</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3d6;--card:#fffdf6;--ink:#2b2a4a;--soft:#6b6a85;--line:#f0dfb4;--red:#e2312d;--redd:#b81f1c;--blue:#1d8fe0;--gold:#ffb81c;--ok:#1f9d55;--bad:#d63b3b;color-scheme:light;--rw:clamp(44px,6.5vw,60px);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-weight:600}
h1,h2,h3,.disp{font-family:"Baloo 2","Nunito",system-ui,sans-serif;font-weight:800;margin:0}
.stage{position:relative;height:clamp(500px,74vh,700px);overflow:hidden;background:linear-gradient(#6cc8ff,#cdeeff 45%,#eaf8ff)}
.sun{position:absolute;left:7%;top:84px;width:74px;height:74px;border-radius:50%;background:#ffd23f;box-shadow:0 0 0 14px rgba(255,210,63,.3),0 0 0 30px rgba(255,210,63,.15)}
.cloud{position:absolute;height:30px;border-radius:30px;background:#fff;opacity:.95;animation:drift 70s linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:44px;height:44px;left:14px;top:-22px}.cloud:after{width:30px;height:30px;left:50px;top:-12px}
.c1{width:110px;top:90px;left:30%}.c2{width:90px;top:60px;left:62%;animation-duration:90s}.c3{width:130px;top:130px;left:84%;animation-duration:110s}
@keyframes drift{from{transform:translateX(-30px)}50%{transform:translateX(50px)}to{transform:translateX(-30px)}}
.sky{position:absolute;left:0;right:0;bottom:48%;height:150px;width:100%}
.crowd{position:absolute;left:0;right:0;top:30%;height:23%;display:flex;align-items:flex-end;justify-content:space-around;padding:0 6px}
.crowd svg{flex:none;overflow:visible;margin-inline:-3px;transform-origin:50% 100%;animation:sway 1.6s ease-in-out infinite}
.crowd.cheer svg{animation:jump .35s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.wall{position:absolute;left:0;right:0;top:52%;height:9%;background:repeating-linear-gradient(0deg,transparent 0 17px,rgba(0,0,0,.12) 17px 18px),linear-gradient(#9a9ca6,#7d7f89);display:flex;align-items:center;justify-content:center;border-top:4px solid #6c6e78}
.wall .disp{color:#fff;font-size:clamp(1.3rem,3.6vw,2.2rem);letter-spacing:.06em;transform:rotate(-2deg);text-shadow:2px 2px 0 var(--redd)}
.bunt{position:absolute;left:0;right:0;top:calc(52% - 6px);display:flex;justify-content:space-between;background:linear-gradient(#5a4a3a,#5a4a3a) 0 2px/100% 2px no-repeat}
.bunt i{border-left:9px solid transparent;border-right:9px solid transparent;border-top:20px solid var(--red)}
.bunt i:nth-child(even){border-top-color:#fff}
.track{position:absolute;left:0;right:0;top:61%;bottom:10%;display:flex;flex-direction:column;background:linear-gradient(#f0c982,#e0a95a)}
.lane{flex:1;position:relative;border-top:3px solid rgba(255,255,255,.9)}
.lane:last-child{border-bottom:3px solid rgba(255,255,255,.9)}
.chip2{position:absolute;left:8px;top:4px;z-index:3;display:flex;gap:6px;align-items:center;font:800 .8rem "Baloo 2";color:#fff;padding:1px 10px;border-radius:99px}
.chip2 b{background:#fff;color:var(--ink);border-radius:99px;padding:0 8px}
.mk{position:absolute;top:0;bottom:0;border-left:3px dashed rgba(255,255,255,.75)}
.fin{position:absolute;left:84%;top:0;bottom:0;width:22px;background:repeating-conic-gradient(var(--ink) 0 25%,#fff 0 50%) 0 0/11px 11px;border:2px solid var(--ink);z-index:1}
.runner{position:absolute;bottom:4px;left:3%;width:var(--rw);z-index:2;transition:left .9s cubic-bezier(.3,1.4,.5,1)}
.runner svg{width:100%;height:auto;display:block;transform-origin:50% 100%}
.run .runner svg{animation:hop .55s ease-in-out infinite}
.win .runner svg{animation:hop .3s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}
.fin:after{content:"FINISH";position:absolute;left:50%;top:-26px;transform:translateX(-50%);background:var(--red);color:#fff;font:800 .72rem "Baloo 2";padding:1px 8px;border-radius:6px;white-space:nowrap}
.grass{position:absolute;left:0;right:0;bottom:4%;height:6%;background:linear-gradient(#5fb84f,#3f9b46)}
.river{position:absolute;left:0;right:0;bottom:0;height:4%;background:#38a3e8}
.top{position:absolute;z-index:5;top:12px;left:12px;right:12px;max-width:960px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(255,253,246,.94);border:2px solid var(--line);border-radius:18px;padding:8px 14px}
.top h1{font-size:1.3rem;line-height:1.1}
.chip{font-size:.8rem;font-weight:800;padding:3px 10px;border-radius:99px;background:#cfeaff;color:#0b4d7a}
.chip.t{background:#ffe9a8;color:#7a5200}
.sp{flex:1}.rule{color:var(--soft);font-weight:800;font-size:.9rem}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 32px}
.panel{margin-top:16px;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:22px}
.center{text-align:center}
.btn{font:800 1rem "Baloo 2",sans-serif;border:0;border-radius:14px;padding:10px 20px;background:var(--red);color:#fff;cursor:pointer;box-shadow:0 5px 0 var(--redd);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--redd)}
.btn.g{background:var(--ok);box-shadow:0 5px 0 #14703c}.btn.y{background:var(--gold);color:#4a3000;box-shadow:0 5px 0 #c98a00}
.btn:focus-visible,.opt:focus-visible,.df:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.vs{display:flex;align-items:center;justify-content:center;gap:22px;margin-bottom:8px}
.vs svg{width:70px;height:auto}.vs .disp{font-size:2rem;color:var(--red)}
.name{font:800 .95rem "Baloo 2"}
.panel h2{font-size:1.6rem;margin:6px 0}
.panel p{margin:4px auto 14px;max-width:46ch;color:var(--soft)}
.df{font:800 .95rem "Nunito";border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:6px 16px;cursor:pointer;margin:0 3px 16px}
.df[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.qhead{display:flex;justify-content:space-between;margin-bottom:10px;font-weight:800;color:var(--soft)}
.time{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:16px}
.time i{display:block;height:100%;background:var(--gold);transform-origin:left}
.q{font:800 1.45rem/1.25 "Baloo 2";margin-bottom:14px;max-width:34ch}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;font:800 1.05rem "Nunito";color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:transform .1s,border-color .1s}
.opt b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#cfeaff;color:#0b4d7a;font:800 .95rem "Baloo 2";flex:none}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--blue)}
.opt.ok{background:#d9f5e3;border-color:var(--ok);color:#0f5b32}
.opt.no{background:#fde0e0;border-color:var(--bad);color:#8a1f1f;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:1.6em;margin-top:12px;font:800 1.05rem "Baloo 2"}
.hidden{display:none!important}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;text-align:left}
.rhead h2{font-size:2rem}.rhead p{margin:2px 0 0}
.badge{display:inline-block;background:#ffe9a8;color:#7a5200;font:800 .8rem "Nunito";padding:3px 12px;border-radius:99px;margin-bottom:6px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.rc{border:2px solid var(--line);border-radius:22px;padding:18px;text-align:center;background:var(--bg)}
.rc.w{border-color:var(--gold);background:linear-gradient(#fff3c4,var(--bg));border-width:3px}
.rc svg{width:96px;height:auto}
.pill{display:inline-block;font:800 .85rem "Nunito";padding:3px 14px;border-radius:99px;background:#dfe3ee;color:#394060}
.rc.w .pill{background:var(--gold);color:#4a3000}
.rc h3{font-size:1.4rem;margin:8px 0 0}.rc .big{font:800 2.2rem "Baloo 2";color:var(--ok)}.rc.w .big{color:#d98a00}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:2px solid var(--line);margin-top:10px;padding-top:10px;font-size:.85rem;color:var(--soft)}
.st b{display:block;color:var(--ink);font:800 .95rem "Baloo 2"}
.stats{margin-top:18px;text-align:left}.stats h3{font-size:1.2rem;margin-bottom:10px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.si{display:flex;justify-content:space-between;gap:10px;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.si small{color:var(--soft);font-weight:800}.si div{font-weight:800}.si span{white-space:nowrap;font-weight:800;text-align:right}
.g1{color:var(--ok)}.r1{color:var(--bad)}
@media (max-width:700px){.fin{left:80%;width:14px}.opts,.cards,.sg{grid-template-columns:1fr}.rule{display:none}.sun{top:96px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.runner{transition:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <svg class="sky" height="150" aria-hidden="true"><defs><pattern id="t" width="600" height="150" patternUnits="userSpaceOnUse">
<rect x="60" y="35" width="60" height="110" fill="#ddcdb7" stroke="#7b6f5c" stroke-width="2"/><path d="M55 35h70l-35-22z" fill="#d4452f"/><g fill="#fff6c2"><rect x="72" y="52" width="9" height="11"/><rect x="98" y="52" width="9" height="11"/><rect x="72" y="76" width="9" height="11"/><rect x="98" y="76" width="9" height="11"/></g>
<rect x="330" y="62" width="70" height="90" fill="#ddcdb7" stroke="#7b6f5c" stroke-width="2"/><path d="M325 62h80l-40-20z" fill="#d4452f"/><g fill="#fff6c2"><rect x="344" y="78" width="9" height="11"/><rect x="376" y="78" width="9" height="11"/></g>
<rect x="220" y="55" width="20" height="95" fill="#8e949c"/><rect x="250" y="72" width="20" height="78" fill="#a2a8b0"/>
<path d="M560 20V140" stroke="#7b6f5c" stroke-width="3"/><rect x="560" y="22" width="34" height="11" fill="#e2312d"/><rect x="560" y="33" width="34" height="11" fill="#fff"/>
<path d="M0 150V100Q150 70 300 100T600 100V150Z" fill="#9fd685"/>
<rect x="478" y="95" width="8" height="40" fill="#6b4423"/><circle cx="482" cy="80" r="26" fill="#2f8f3f"/><rect x="16" y="105" width="7" height="35" fill="#6b4423"/><circle cx="20" cy="92" r="18" fill="#2f8f3f"/>
</pattern></defs><rect width="100%" height="150" fill="url(#t)"/></svg>
  <div class="crowd" id="crowd" aria-hidden="true"></div>
  <div class="wall"><span class="disp">MERDEKA!!</span></div>
  <div class="bunt" id="bunt" aria-hidden="true"></div>
  <div class="track">
    <div class="lane" id="laneP"><span class="chip2" style="background:var(--red)">Pemain 1 <b id="mP">0 m</b></span><i class="mk" style="left:50%"></i><div class="runner" id="rP"></div></div>
    <div class="lane" id="laneB"><span class="chip2" style="background:var(--blue)">Lawan Bot <b id="mB">0 m</b></span><i class="mk" style="left:50%"></i><div class="runner" id="rB"></div></div>
    <i class="fin"></i>
  </div>
  <div class="grass"></div><div class="river"></div>
  <header class="top">
    <h1>Balap Karung Kuis</h1><span class="chip" id="state">Siap dimulai</span><span class="chip t">Target 100 m</span>
    <span class="sp"></span><span class="rule">Benar +10 m • Salah −3 m</span>
  </header>
</div>

<main class="wrap">
  <section class="panel center" id="start">
    <div class="vs"><div><div id="vp"></div><div class="name" style="color:var(--red)">Pemain 1</div></div><span class="disp">VS</span><div><div id="vb"></div><div class="name" style="color:var(--blue)">Lawan Bot</div></div></div>
    <h2>Siap duel 1 vs 1?</h2>
    <p>Jawab kuis secepat dan setepat mungkin. Setiap jawaban benar melompatkan karungmu 10 meter.</p>
    <div role="group" aria-label="Tingkat bot"><button class="df" data-d="mudah">Bot mudah</button><button class="df" data-d="sedang">Bot sedang</button><button class="df" data-d="sulit">Bot sulit</button></div><br>
    <button class="btn" id="go">Mulai lomba</button>
  </section>
  <section class="panel hidden" id="quiz">
    <div class="qhead"><span id="qn">Soal 1</span><span id="tt">15 detik</span></div>
    <div class="time"><i id="bar"></i></div>
    <div class="q" id="qt"></div><div class="opts" id="opts"></div><div class="fb" id="fb" aria-live="polite"></div>
  </section>
  <section class="panel hidden" id="end"></section>
</main>

<script>
const QS=[
["Ibu kota Provinsi Jawa Barat adalah...","Bandung",["Surabaya","Semarang","Medan"]],
["7 × 8 = ...","56",["54","49","63"]],
["Planet yang paling dekat dengan Matahari adalah...","Merkurius",["Venus","Mars","Bumi"]],
["Indonesia memproklamasikan kemerdekaan pada tahun...","1945",["1928","1950","1965"]],
["Hewan mamalia yang bisa terbang adalah...","Kelelawar",["Elang","Burung hantu","Capung"]],
["Air membeku pada suhu... derajat Celsius","0",["10","−10","100"]],
["Lambang kimia untuk emas adalah...","Au",["Ag","Fe","Go"]],
["Bahasa Inggris dari “apel” adalah...","Apple",["Orange","Grape","Mango"]],
["Gas yang kita hirup untuk bernapas adalah...","Oksigen",["Nitrogen","Helium","Karbon dioksida"]],
["144 : 12 = ...","12",["11","14","16"]],
["Penjahit bendera pusaka Merah Putih adalah...","Fatmawati",["Kartini","Cut Nyak Dien","Dewi Sartika"]],
["Organ yang memompa darah ke seluruh tubuh adalah...","Jantung",["Paru-paru","Hati","Ginjal"]]
];
const DIFF={mudah:[.5,4800],sedang:[.65,4200],sulit:[.8,3600]};
let diff="sedang",S,ct;
const $=id=>document.getElementById(id);
function sack(head,shirt,o={}){return `<svg viewBox="0 -12 80 112" aria-hidden="true">${o.up?'<path d="M20 52L8 28M60 52L72 28" stroke="#ffd9a8" stroke-width="8" stroke-linecap="round"/>':''}<ellipse cx="40" cy="96" rx="22" ry="4" fill="rgba(0,0,0,.2)"/><path d="M14 58L22 94Q40 100 58 94L66 58Z" fill="#c98a4b" stroke="#6b4423" stroke-width="3" stroke-linejoin="round"/><path d="M20 66Q40 74 60 66" stroke="#6b4423" stroke-width="2.5" fill="none"/><circle cx="40" cy="82" r="6" fill="#e9b778" stroke="#6b4423" stroke-width="2"/><rect x="18" y="48" width="44" height="18" rx="9" fill="${shirt}" stroke="#2b2a4a" stroke-width="3"/><circle cx="40" cy="28" r="22" fill="#ffd9a8" stroke="#2b2a4a" stroke-width="3"/><path d="M18 22Q40 4 62 22L62 29Q40 17 18 29Z" fill="#fff" stroke="#2b2a4a" stroke-width="3"/><path d="M18 22Q40 4 62 22L62 25Q40 12 18 25Z" fill="${head}"/><circle cx="32" cy="36" r="2.6" fill="#2b2a4a"/><circle cx="48" cy="36" r="2.6" fill="#2b2a4a"/><path d="M32 43Q40 51 48 43Z" fill="#c2332f" stroke="#2b2a4a" stroke-width="2" stroke-linejoin="round"/>${o.crown?'<path d="M26 8L28 -4L35 3L40 -8L45 3L52 -4L54 8Z" fill="#ffb81c" stroke="#2b2a4a" stroke-width="2.5" stroke-linejoin="round"/>':''}${o.medal?'<circle cx="40" cy="64" r="7" fill="#cfd6e4" stroke="#2b2a4a" stroke-width="2"/><text x="40" y="68" font-size="10" font-weight="800" text-anchor="middle" fill="#2b2a4a">2</text>':''}</svg>`}
const P=(o)=>sack("#e2312d","#7a3fd0",o),B=(o)=>sack("#e2312d","#1d8fe0",o);
$("rP").innerHTML=P();$("rB").innerHTML=B();$("vp").innerHTML=P();$("vb").innerHTML=B();

(function(){const cols=["#e2312d","#1d8fe0","#ffb81c","#7a3fd0","#1f9d55","#ff7a59","#2bb6a8"],sk=["#ffd9a8","#e8b27d","#c58c5a","#f3c99b"],hr=["#2b2a4a","#4a2c17","#111","#6b3b1e"];
 let h="";for(let i=0;i<30;i++){const w=34+Math.round(Math.random()*14),c=cols[i%7],s=sk[(i*3)%4],r=hr[(i*5)%4],flag=i%5==0,d=(Math.random()*1.5).toFixed(2);
 h+=`<svg width="${w}" viewBox="0 -16 40 76" style="animation-delay:-${d}s"><path d="M9 40L3 16M31 40L37 16" stroke="${s}" stroke-width="5" stroke-linecap="round"/>${flag?'<path d="M37 16V-12" stroke="#6b4423" stroke-width="2"/><path d="M37 -12h12v5h-12z" fill="#e2312d"/><path d="M37 -7h12v5h-12z" fill="#fff" stroke="#ddd" stroke-width=".5"/>':''}<rect x="8" y="30" width="24" height="30" rx="8" fill="${c}"/><circle cx="20" cy="19" r="10" fill="${s}"/><path d="M10 18Q20 4 30 18Q20 11 10 18Z" fill="${r}"/><ellipse cx="20" cy="23" rx="3" ry="2.4" fill="#8a2a2a"/></svg>`}
 $("crowd").innerHTML=h;
 let f="";for(let i=0;i<46;i++)f+="<i></i>";$("bunt").innerHTML=f})();
function cheer(){$("crowd").classList.add("cheer");clearTimeout(ct);ct=setTimeout(()=>$("crowd").classList.remove("cheer"),1300)}

function reset(){clearInterval(S&&S.tm);clearInterval(S&&S.bot);S={p:0,b:0,i:0,run:false,locked:false,t:0,order:[],pc:0,pw:0,bc:0,bw:0,t0:0,log:[]};
 $("rP").innerHTML=P();$("rB").innerHTML=B();["laneP","laneB"].forEach(k=>$(k).classList.remove("run","win"));$("state").textContent="Siap dimulai";draw()}
function draw(){const pos=m=>`calc(3% + (94% - var(--rw)) * ${Math.min(m,100)/100})`;$("rP").style.left=pos(S.p);$("rB").style.left=pos(S.b);$("mP").textContent=S.p+" m";$("mB").textContent=S.b+" m"}
function show(id){["start","quiz","end"].forEach(k=>$(k).classList.toggle("hidden",k!==id))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setDiff(d){diff=d;document.querySelectorAll(".df").forEach(b=>b.setAttribute("aria-pressed",b.dataset.d===d))}
document.querySelectorAll(".df").forEach(b=>b.onclick=()=>setDiff(b.dataset.d));setDiff("sedang");

function begin(){reset();S.order=shuffle(QS);S.run=true;S.t0=Date.now();
 ["laneP","laneB"].forEach(k=>$(k).classList.add("run"));$("state").textContent="Berlangsung";show("quiz");cheer();next();
 const [pr,ms]=DIFF[diff];
 S.bot=setInterval(()=>{if(!S.run)return;if(Math.random()<pr){S.b+=10;S.bc++}else{S.b=Math.max(0,S.b-3);S.bw++}draw();cheer();check()},ms)}
function next(){if(!S.run)return;
 const q=S.order[S.i%S.order.length];S.i++;S.locked=false;S.cur=q;
 $("qn").textContent="Soal "+S.i;$("qt").textContent=q[0];$("fb").textContent="";
 $("opts").innerHTML=shuffle([q[1],...q[2]]).map((o,k)=>`<button class="opt" data-v="${o}"><b>${"ABCD"[k]}</b>${o}</button>`).join("");
 $("opts").querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,q[1]));
 S.t=15;$("tt").textContent="15 detik";clearInterval(S.tm);
 const bar=$("bar");bar.style.transition="none";bar.style.transform="scaleX(1)";
 requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.transition="transform 15s linear";bar.style.transform="scaleX(0)"}));
 S.tm=setInterval(()=>{S.t--;$("tt").textContent=Math.max(S.t,0)+" detik";if(S.t<=0){clearInterval(S.tm);answer(null,q[1])}},1000)}
function answer(btn,right){if(S.locked||!S.run)return;S.locked=true;clearInterval(S.tm);
 [...$("opts").children].forEach(b=>{b.disabled=true;if(b.dataset.v===right)b.classList.add("ok")});
 const good=btn&&btn.dataset.v===right;
 S.log.push({n:S.i,t:S.cur[0],c:good?1:0});
 if(good){S.p+=10;S.pc++;$("fb").textContent="Benar! Karungmu melompat 10 m.";$("fb").style.color="var(--ok)"}
 else{if(btn)btn.classList.add("no");S.p=Math.max(0,S.p-3);S.pw++;$("fb").textContent=(btn?"Belum tepat":"Waktu habis")+", mundur 3 m. Jawaban: "+right;$("fb").style.color="var(--bad)"}
 draw();cheer();if(check())return;setTimeout(next,1400)}
function check(){if(!S.run)return true;
 if(S.p<100&&S.b<100)return false;
 S.run=false;clearInterval(S.tm);clearInterval(S.bot);
 const win=S.p>=100,el=((Date.now()-S.t0)/1000).toFixed(1);
 ["laneP","laneB"].forEach(k=>$(k).classList.remove("run"));$(win?"laneP":"laneB").classList.add("win");
 $(win?"rP":"rB").innerHTML=(win?P:B)({up:1,crown:1});$(win?"rB":"rP").innerHTML=(win?B:P)({medal:1});
 $("state").textContent="Selesai";cheer();$("crowd").classList.add("cheer");
 const acc=(c,w)=>c+w?Math.round(c/(c+w)*100)+"%":"0%";
 const pl={n:"Pemain 1",m:S.p,c:S.pc,w:S.pw,f:P},bt={n:"Lawan Bot",m:S.b,c:S.bc,w:S.bw,f:B};
 const [a,b]=win?[pl,bt]:[bt,pl];
 const card=(x,w)=>`<div class="rc ${w?"w":""}">${x.f(w?{up:1,crown:1}:{medal:1})}<div><span class="pill">${w?"Juara 1 • Pemenang":"Juara 2 • Runner-Up"}</span></div><h3>${x.n}</h3><div class="big">${Math.min(x.m,100)} m</div><div class="st"><div>Akurasi<b>${acc(x.c,x.w)}</b></div><div>Benar/Salah<b>${x.c}/${x.w}</b></div><div>Waktu<b>${el} dtk</b></div></div></div>`;
 $("end").innerHTML=`<div class="rhead"><div><span class="badge">Hasil duel 1 vs 1 balap karung</span><h2>Pemenang: ${a.n}!</h2><p>Menyentuh garis finis 100 m paling cepat!</p></div><div class="btns"><button class="btn g" id="again">Main lagi</button><button class="btn" id="setb" style="background:#5b6b8c;box-shadow:0 5px 0 #3d4a66">Ubah pengaturan</button><button class="btn y" id="done">Selesai</button></div></div><div class="cards">${card(a,1)}${card(b,0)}</div><div class="stats"><h3>Statistik soal yang kamu jawab</h3><div class="sg">${S.log.map(l=>`<div class="si"><div><small>Soal #${l.n}</small><div>${l.t}</div></div><span><span class="g1">${l.c} Benar</span><br><span class="r1">${1-l.c} Salah</span></span></div>`).join("")}</div></div>`;
 setTimeout(()=>{show("end");$("end").scrollIntoView({behavior:"smooth",block:"start"});
  $("again").onclick=()=>{begin();scrollTo({top:0,behavior:"smooth"})};
  $("setb").onclick=$("done").onclick=()=>{reset();show("start");scrollTo({top:0,behavior:"smooth"})}},1100);
 return true}
$("go").onclick=begin;reset();
</script>
